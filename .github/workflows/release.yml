name: build-and-release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout desktop repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux packaging deps
        run: sudo apt-get update && sudo apt-get install -y libcrypt1

      - name: Install desktop dependencies
        run: npm ci

      - name: Build AppImage and deb
        run: npm run package:linux

      - name: Create checksums
        run: sha256sum release/*.AppImage release/*.deb > release/SHA256SUMS

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shmakk-linux-${{ github.run_number }}
          path: |
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS
        env: 
          GH_TOKEN: ${{ secrets.GH_TOKEN }}